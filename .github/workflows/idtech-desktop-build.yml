name: Native idTech 4 desktop executable (Windows)
on:
  push:
    branches: [main]
    paths:
      - 'native/core/**'
      - 'native/idtech/**'
      - 'native/tools/**'
      - 'native/generated/**'
      - '.github/workflows/idtech-desktop-build.yml'
  workflow_dispatch:

jobs:
  idtech-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Prepare Python assets converter
        shell: pwsh
        run: python -m pip install pillow
      - name: Stage native idTech 4 project
        shell: pwsh
        run: python native/tools/prepare_desktop.py
      - name: Cache DirectX 2010 headers and import libraries
        id: legacy-sdk
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}\dxsdk-jun10
          key: ashenmeridian-dxsdk-june2010-headers-libs-v1
      - name: Install original idTech 4 DirectX dependencies on cache miss
        if: steps.legacy-sdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          choco install directx-sdk --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw 'Legacy DirectX SDK installation failed' }
          $dx = Join-Path ([System.Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft DirectX SDK (June 2010)'
          $cache = Join-Path $env:RUNNER_TEMP 'dxsdk-jun10'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          Copy-Item "$dx/Include" "$cache/Include" -Recurse -Force
          Copy-Item "$dx/Lib" "$cache/Lib" -Recurse -Force
      - name: Preserve DirectX build dependencies for subsequent CI attempts
        if: steps.legacy-sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}\dxsdk-jun10
          key: ashenmeridian-dxsdk-june2010-headers-libs-v1
      - name: Set original DirectX include and library locations
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP 'dxsdk-jun10'
          if (-not (Test-Path "$cache/Include/dxsdkver.h")) { throw 'Legacy DirectX header unavailable' }
          if (-not (Test-Path "$cache/Lib/x86")) { throw 'Legacy DirectX x86 import libraries unavailable' }
          "DXSDK_DIR=$cache/" >> $env:GITHUB_ENV
      - name: Compile original idTech 4 engine with native Meridian game
        shell: pwsh
        run: |
          $pf = [System.Environment]::GetFolderPath('ProgramFilesX86')
          $vswhere = Join-Path $pf 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsdir = (& $vswhere -latest -products '*' -property installationPath).Trim()
          if (-not $vsdir) { throw 'Visual Studio not found' }
          $msbuild = Join-Path $vsdir 'MSBuild\Current\Bin\MSBuild.exe'
          & $msbuild 'build/desktop-idtech4/neo/doom3.sln' '/m:2' '/p:Configuration=Release' '/p:Platform=Win32' '/p:PlatformToolset=v145' '/p:GenerateDebugInformation=true' '/v:minimal' '/nologo'
          if ($LASTEXITCODE -ne 0) { throw 'idTech 4 engine compilation failed. Review compiler errors above.' }
      - name: Check generated game executable
        shell: pwsh
        run: |
          $bins = Get-ChildItem 'build/desktop-idtech4' -Recurse -Filter '*.exe' |
            Where-Object { $_.Name -match 'doom|meridian' }
          if (-not $bins) { throw 'Build produced no game executable.' }
          $bins | ForEach-Object { Write-Host "Executable: $($_.FullName)" }

      - name: Install Microsoft legacy DirectX runtime required by idTech 4
        shell: pwsh
        run: |
          choco install directx --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw 'Installing the legacy DirectX game runtime failed' }
          $required = @('XAudio2_7.dll','XInput1_3.dll','X3DAudio1_7.dll')
          foreach ($dll in $required) {
            $path = Join-Path "$env:WINDIR/SysWOW64" $dll
            if (-not (Test-Path $path)) { throw "Required 32-bit DirectX runtime missing: $dll" }
            Write-Host "Legacy DirectX runtime available: $dll"
          }
      - name: Enable Mesa LLVMpipe OpenGL for headless Windows CI
        shell: pwsh
        run: |
          # GitHub hosted Windows machines have no 3D GPU driver (typically GL 1.1).
          # Test with a pinned Mesa x86 software OpenGL driver; do not ship it.
          $archive=Join-Path $env:RUNNER_TEMP 'mesa3d-24.3.4-release-msvc.7z'
          $link='https://github.com/pal1000/mesa-dist-win/releases/download/24.3.4/mesa3d-24.3.4-release-msvc.7z'
          Invoke-WebRequest $link -OutFile $archive
          $hash=(Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne '7ebc711ad1896ac88ab21e142f1017f8ff035f0f342bdb72fbb5e2eb881ba363'){
            throw 'Software OpenGL package failed pinned SHA256 verification'
          }
          $root=Join-Path $env:RUNNER_TEMP 'mesa-native-x86'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $seven=(Get-Command 7z.exe -ErrorAction Stop).Source
          & $seven x -y $archive "-o$root" | Out-Null
          if($LASTEXITCODE -ne 0){throw 'Cannot extract Mesa software OpenGL'}
          $ogl = Get-Item (Join-Path $root 'x86/opengl32.dll') -ErrorAction SilentlyContinue
          if(-not $ogl){throw 'Mesa x86 opengl32.dll absent'}
          $gallium=Join-Path $ogl.DirectoryName 'libgallium_wgl.dll'
          if(-not(Test-Path $gallium)){throw "Mesa x86 gallium not in $($ogl.DirectoryName)"}
          $target=(Resolve-Path 'build/desktop-idtech4/build/Win32/Release').Path
          Copy-Item (Join-Path $ogl.DirectoryName '*.dll') -Destination $target -Force
          'GALLIUM_DRIVER=llvmpipe' >> $env:GITHUB_ENV
          'LIBGL_ALWAYS_SOFTWARE=1' >> $env:GITHUB_ENV
          Write-Host "Headless OpenGL supplied via Mesa LLVMpipe x86: $($ogl.DirectoryName)"
      - name: Start native game and check for an immediate crash
        shell: pwsh
        run: |
          $gameRoot = (Resolve-Path 'build/desktop-idtech4').Path
          $gameExe = Join-Path $gameRoot 'build/Win32/Release/Doom3BFG.exe'
          $logOut = Join-Path $gameRoot 'meridian-startup.stdout.log'
          $logErr = Join-Path $gameRoot 'meridian-startup.stderr.log'
          if (-not (Test-Path $gameExe)) { throw "Native executable is missing: $gameExe" }
          $env:MERIDIAN_NATIVE_SMOKE = '1'
          $arguments = '+set fs_basepath "' + $gameRoot + '" +set r_fullscreen 0 +set com_allowConsole 1'
          Write-Host "Launching built idTech executable from $gameRoot"
          $process = Start-Process -FilePath $gameExe -ArgumentList $arguments -WorkingDirectory $gameRoot -PassThru -RedirectStandardOutput $logOut -RedirectStandardError $logErr
          $deadline = (Get-Date).AddSeconds(12)
          while (-not $process.HasExited -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 200
            $process.Refresh()
          }
          if (-not $process.HasExited) {
            Write-Host 'Native engine remained running for startup smoke duration.'
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          } else {
            Write-Host "Native engine quit during startup: exit code $($process.ExitCode)"
            if (Test-Path $logOut) { Get-Content $logOut -Tail 80 }
            if (Test-Path $logErr) { Get-Content $logErr -Tail 80 }
            throw 'Executable exited before 12-second startup smoke completed.'
          }
          $healthFile = Join-Path $gameRoot 'meridian-native-health.txt'
          if (-not (Test-Path $healthFile)) { throw 'Process lived but never drew Meridian gameplay.' }
          $health = Get-Content $healthFile -Raw
          Write-Host "Native renderer and gameplay diagnostics: $health"
          if (-not $health.Contains('renderer=idTech4') -or -not $health.Contains('room=tutorial')) {
            throw 'No native Meridian tutorial frame was confirmed.'
          }
          $draws = [regex]::Match($health, 'draws=(\d+)')
          $ticks = [regex]::Match($health, 'ticks=(\d+)')
          if (-not $draws.Success -or -not $ticks.Success -or
              [int]$draws.Groups[1].Value -lt 1 -or [int]$ticks.Groups[1].Value -lt 1) {
            throw 'Renderer or gameplay loop did not advance.'
          }
          if (-not $health.Contains('smoke_moved=true') -or -not $health.Contains('smoke_fired=true')) {
            throw 'Native movement and shooting did not execute in the renderer loop.'
          }
      - name: Resolve native crash through matching MSVC PDB symbols
        if: failure()
        shell: pwsh
        run: |
          $gameRoot = (Resolve-Path 'build/desktop-idtech4').Path
          $exe = Join-Path $gameRoot 'build/Win32/Release/Doom3BFG.exe'
          if (-not (Test-Path $exe)) { throw 'No executable available for crash analysis' }
          $pdbs = @(Get-ChildItem $gameRoot -Recurse -Filter '*.pdb' -ErrorAction SilentlyContinue)
          Write-Host "MSVC symbol databases found: $($pdbs.Count)"
          $pdbs | Select-Object -First 20 | ForEach-Object { Write-Host "PDB: $($_.FullName)" }
          $installer = Join-Path $env:RUNNER_TEMP 'winsdksetup.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/?linkid=2272610' -OutFile $installer
          $sig = Get-AuthenticodeSignature $installer
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft') { throw 'Debugger installer signature invalid' }
          $install = Start-Process -FilePath $installer -ArgumentList '/features OptionId.WindowsDesktopDebuggers /quiet /norestart' -Wait -PassThru
          if ($install.ExitCode -notin @(0,3010)) { throw "Debuggers installation failed: $($install.ExitCode)" }
          $kits = Join-Path ([System.Environment]::GetFolderPath('ProgramFilesX86')) 'Windows Kits'
          $cdb = Get-ChildItem $kits -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'Debuggers\\x86' } | Select-Object -First 1
          if (-not $cdb) { throw 'Windows x86 console debugger missing' }
          $dumpDir = Join-Path $gameRoot 'crash-analysis'
          New-Item -Path $dumpDir -ItemType Directory -Force | Out-Null
          $procdump = Join-Path $env:RUNNER_TEMP 'procdump.exe'
          Invoke-WebRequest 'https://live.sysinternals.com/procdump.exe' -OutFile $procdump
          $pdSig = Get-AuthenticodeSignature $procdump
          if ($pdSig.Status -ne 'Valid' -or $pdSig.SignerCertificate.Subject -notmatch 'Microsoft') { throw 'ProcDump signature invalid' }
          & $procdump -accepteula -e -mm -x $dumpDir $exe +set fs_basepath $gameRoot +set r_fullscreen 0 +set logFile 2
          $dump = Get-ChildItem $dumpDir -Filter '*.dmp' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dump) { throw 'No process crash dump captured' }
          $pdbDirs = @($pdbs | ForEach-Object { $_.DirectoryName } | Sort-Object -Unique)
          $symDir = Join-Path $env:RUNNER_TEMP 'symbols'
          $symbolPath = ($pdbDirs -join ';') + ';srv*' + $symDir + '*https://msdl.microsoft.com/download/symbols'
          $commands = '.reload /f Doom3BFG.exe; !analyze -v; .ecxr; kv 55; q'
          & $cdb.FullName -z $dump.FullName -i (Split-Path $exe) -y $symbolPath -c $commands
      - name: Upload matching PDBs and crash analysis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meridian-debug-symbols-and-crash
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/desktop-idtech4/build/**/*.pdb
            build/desktop-idtech4/crash-analysis/*.dmp
      - name: Upload native Windows build and startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meridian-idtech4-win32
          if-no-files-found: warn
          retention-days: 7
          path: |
            build/desktop-idtech4/build/Win32/Release/Doom3BFG.exe
            build/desktop-idtech4/base/
            build/desktop-idtech4/meridian-startup.stdout.log
            build/desktop-idtech4/meridian-startup.stderr.log
