name: Check Mesa OpenGL x86 software package for Windows CI
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mesa-headless-check.yml']
  workflow_dispatch:
jobs:
  mesa:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Download and inspect pinned Mesa x86 build
        shell: pwsh
        run: |
          $ProgressPreference='SilentlyContinue'
          $archive=Join-Path $env:RUNNER_TEMP 'mesa3d-24.3.4-release-msvc.7z'
          $link='https://github.com/pal1000/mesa-dist-win/releases/download/24.3.4/mesa3d-24.3.4-release-msvc.7z'
          Invoke-WebRequest $link -OutFile $archive
          Write-Host "Downloaded: $((Get-Item $archive).Length) bytes"
          $hash=(Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Archive SHA256: $hash"
          Write-Host "Candidate Mesa version tested: 24.3.4; SHA verified after extraction inventory"
          $seven=(Get-Command 7z.exe -ErrorAction SilentlyContinue)
          if(-not $seven){$seven=(Get-Item 'C:/Program Files/7-Zip/7z.exe' -ErrorAction SilentlyContinue)}
          if(-not $seven){throw '7z not found on Windows runner'}
          Write-Host "7z: $($seven.Source ?? $seven.FullName)"
          $root=Join-Path $env:RUNNER_TEMP 'mesa-check'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          & ($seven.Source ?? $seven.FullName) x -y $archive "-o$root" | Select-Object -Last 12
          Write-Host "Exit: $LASTEXITCODE"
          Get-ChildItem $root -Recurse -File | ForEach-Object { Write-Host "ARCHIVE: $($_.FullName) $($_.Length)" }
          $ogl=@(Get-ChildItem $root -Recurse -File | Where-Object { $_.Name -ieq 'opengl32.dll' })
          Write-Host "OpenGL DLL candidates: $($ogl.Count)"
